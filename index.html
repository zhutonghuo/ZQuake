  </div>
  <div class="tb-btns">
    <button type="button" id="tbMin" class="tb-btn" title="最小化" aria-label="最小化">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="6" y1="12" x2="18" y2="12"/></svg>
    </button>
    <button type="button" id="tbMax" class="tb-btn" title="最大化" aria-label="最大化">
      <svg class="i-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>

    </button>
    <button type="button" id="tbClose" class="tb-btn tb-close" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>
</div>

<div id="boot">
  <div class="boot-bg" aria-hidden="true">
    <span class="ripple"></span><span class="ripple"></span><span class="ripple"></span>
  </div>
  <div class="bstage" id="bstage">
    <section class="bside-left">
      <div class="boot-card">
        <div class="boot-brand">
          <span class="boot-logo"></span>
          <span class="boot-brand-text">
            <span class="boot-name">ZQUAKE</span>
            <span class="boot-tag">SEISMIC OBSERVATORY · 地震观测台</span>
          </span>
        </div>
        <div class="boot-status-row">
          <span class="dot" id="bootDot"></span>
          <span id="bootStatus">正在下载资源包 · 首次约需 1 分钟</span>
        </div>
        <div class="boot-progress">
          <div class="boot-pct"><span id="bootPct">0</span><span class="unit">%</span></div>
          <div class="boot-mb"><span id="bootMbNow">0.0</span> / <span id="bootMbTotal">19.4</span> MB</div>
          <div class="bar"><div class="bar-fill" id="bootBar"></div></div>
        </div>
        <div class="now" id="bootNow">资源包 20MB · 首次加载后浏览器会缓存，下次秒开</div>
        <button type="button" id="bootSkip" class="boot-skip">跳过加载，直接进 →</button>
      </div>
      <ul class="blog" id="bootlog"></ul>
    </section>
    <section class="bside-right">
      <div class="game-card">
        <div class="sn-bar">
          <span class="sn-score" id="snScore">0</span>
          <button class="sn-btn" id="snRestart">RESTART</button>
          <span class="sn-best" id="snBest">HI: 0</span>
        </div>
        <div class="board-wrap" id="snWrap">
          <canvas id="snBoard" width="400" height="400"></canvas>
        </div>
        <p class="hint">方向键 / 滑动 开始 · 空格 或 RESTART 重开</p>
      </div>
    </section>
  </div>
</div>
<div id="err" hidden><h1>错误</h1><pre id="errmsg"></pre></div>
